name: Tests

on:
  push:
    branches: [devel, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]   # spec floor and the version development is tested on
        include:
          # Current Python 3.10 builds are available for Intel macOS, not ARM64.
          - os: macos-15-intel
            python: "3.10"
          - os: macos-15
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run offline suite (live checks skip without credentials)
        run: .venv/bin/python -m pytest
      # K3/K7 can skip when wheel building is unavailable; this check must fail instead.
      - name: Build, verify and smoke-test the wheel
        run: .venv/bin/python scripts/build_release.py --smoke
