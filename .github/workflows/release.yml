name: Release modelSpell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modelspell-release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read version
        id: config
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import re,pathlib; print(re.search(r"^__version__ = \"([0-9]+\.[0-9]+\.[0-9]+)\"$", pathlib.Path("modelspell/_version.py").read_text(), re.M).group(1))')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.config.outputs.tag }}
        run: |
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" == false ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require version bump after shipped-file changes
        if: steps.existing.outputs.exists == 'true'
        shell: bash
        env:
          TAG: ${{ steps.config.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if ! python scripts/build_release.py --changed-since "$TAG"; then
            echo "Shipped files changed after $TAG was released." >&2
            echo "Bump modelspell/_version.py and add a NEWS.md entry before merging to main." >&2
            exit 1
          fi
          echo "No shipped-file changes since $TAG; nothing to release."

      - name: Verify the staged candidate wheel and named live gate
        if: steps.existing.outputs.exists != 'true'
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.config.outputs.tag }}
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" != true ]]; then
            echo "Stage the verified candidate and its gate report on a draft release." >&2
            exit 1
          fi
          NAME="modelspell-$VERSION-py3-none-any.whl"
          gh release download "$TAG" --pattern "$NAME" --pattern provider-gate.json --dir candidate
          python scripts/verify_provider_refactor.py --publication-check \
            candidate/provider-gate.json "candidate/$NAME" "$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish the verified candidate
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.config.outputs.version }}
          TAG: ${{ steps.config.outputs.tag }}
          NAME: ${{ steps.build.outputs.name }}
          COMMIT: ${{ steps.build.outputs.commit }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Verify an existing tag or bind the new tag to the tested source.
          tag_commit="$(git rev-parse --verify "$TAG^{commit}" 2>/dev/null || true)"
          if [[ -n "$tag_commit" && "$tag_commit" != "$COMMIT" ]]; then
            echo "Release tag points to a different source commit." >&2
            exit 1
          fi
          # Stage the verified local bytes again before making the release public.
          gh release upload "$TAG" "candidate/$NAME" candidate/provider-gate.json --clobber
          {
            awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{on=0} on' NEWS.md
            echo
            echo "### Install"
            echo
            echo '```'
            echo "modelSpell @ https://github.com/$REPO/releases/download/$TAG/$NAME#sha256=$SHA256"
            echo '```'
            echo
            echo "sha256: \`$SHA256\`"
          } > notes.md
          gh release edit "$TAG" --target "$COMMIT" --title "modelSpell $VERSION" --notes-file notes.md --draft=false
          gh release download "$TAG" --pattern "$NAME" --dir published
          printf '%s  %s\n' "$SHA256" "published/$NAME" | sha256sum --check
