name: Tests

on:
  push:
    branches: [devel, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]   # spec floor and the version development is tested on
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run offline suite (live checks skip without credentials)
        run: python -m pytest
