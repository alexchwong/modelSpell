<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>modelSpell dev UI</title>
<style>
  :root { --bg:#fafafa; --fg:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --box:#fff; --accent:#2f5bd3; --err:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161617; --fg:#ececf0; --muted:#9a9aa2; --line:#3a3a3e; --box:#1f1f22; --accent:#7ea2ff; --err:#ff7a6b; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  header h1 { font-size:16px; margin:0; }
  #summary { color:var(--muted); font-family:ui-monospace, monospace; font-size:12px; flex:1; }
  textarea, input, select { width:100%; font:inherit; color:inherit; background:var(--box); border:1px solid var(--line); border-radius:6px; padding:8px; }
  textarea { resize:vertical; font-family:ui-monospace, monospace; }
  button { font:inherit; padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:var(--box); color:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width: 800px) { .grid { grid-template-columns:1fr; } }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  pre { margin:0; min-height:180px; max-height:50vh; overflow:auto; white-space:pre-wrap; word-break:break-word;
        background:var(--box); border:1px solid var(--line); border-radius:6px; padding:8px; font:13px/1.45 ui-monospace, monospace; }
  #reasoning { color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; margin:8px 0; }
  #status { font-family:ui-monospace, monospace; font-size:12px; color:var(--muted); }
  #status.error { color:var(--err); }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); width:min(560px, 92vw); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  .inline { display:flex; gap:8px; } .inline > :first-child { flex:1; }
  .hidden { display:none; }
  details pre { min-height:0; }
  #gen { border:1px solid var(--line); border-radius:8px; padding:4px 12px 8px; margin-top:10px; }
  .fields { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:0 12px; }
  .fields label { margin-top:8px; }
  .why { display:block; font-size:11px; color:var(--muted); min-height:1em; }
  input:disabled, textarea:disabled, select:disabled { opacity:.55; }
  #advanced { margin-top:8px; }
  #advanced > summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .note { color:var(--muted); font-size:12px; }
  #stop_seqs { min-height:0; }
  #oc { border:1px solid var(--line); border-radius:8px; padding:4px 12px 8px; margin-top:16px; }
  #oc > summary { cursor:pointer; font-weight:600; padding:4px 0; }
  #oc-other > summary { cursor:pointer; color:var(--muted); font-size:13px; }
  #oc-other .inline { max-width:420px; margin-top:6px; }
  #oc-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
  #oc-table th, #oc-table td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  #oc-table td details pre { max-height:30vh; font-size:12px; }
  #oc-table td summary { cursor:pointer; font-family:ui-monospace, monospace; }
  .st-pass { color:#1e8e3e; } .st-fail { color:var(--err); } .st-inconclusive, .st-blocked, .st-not_applicable { color:var(--muted); }
  #oc-status { font-family:ui-monospace, monospace; font-size:12px; color:var(--muted); }
  #oc-copy-fallback { min-height:6em; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>modelSpell dev UI <span id="version"></span></h1>
  <span id="summary"></span>
  <button id="open-settings">Model settings</button>
</header>

<label for="system">System prompt (optional)</label>
<textarea id="system" rows="2"></textarea>
<label for="prompt">Input</label>
<textarea id="prompt" rows="6" placeholder="Ctrl+Enter to send"></textarea>

<div id="gen">
  <div class="fields">
    <div id="reasoning-field">
      <label for="g-reasoning">Reasoning</label>
      <select id="g-reasoning">
        <option value="">Backend default</option><option value="off">off</option>
        <option value="low">low</option><option value="medium">medium</option><option value="high">high</option>
      </select>
    </div>
    <div><label for="g-temperature">Temperature</label><input id="g-temperature" inputmode="decimal" autocomplete="off"><span class="why" id="why-temperature"></span></div>
    <div><label for="g-max_tokens">Max tokens</label><input id="g-max_tokens" inputmode="numeric" autocomplete="off"><span class="why" id="why-max_tokens"></span></div>
  </div>
  <details id="advanced">
    <summary id="adv-summary">Advanced</summary>
    <div class="fields">
      <div><label for="g-top_p">Top-p</label><input id="g-top_p" inputmode="decimal" autocomplete="off"><span class="why" id="why-top_p"></span></div>
      <div><label for="g-top_k">Top-k</label><input id="g-top_k" inputmode="numeric" autocomplete="off"><span class="why" id="why-top_k"></span></div>
      <div><label for="g-min_p">Min-p</label><input id="g-min_p" inputmode="decimal" autocomplete="off"><span class="why" id="why-min_p"></span></div>
      <div><label for="g-repetition_penalty">Repetition penalty</label><input id="g-repetition_penalty" inputmode="decimal" autocomplete="off"><span class="why" id="why-repetition_penalty"></span></div>
      <div><label for="g-presence_penalty">Presence penalty</label><input id="g-presence_penalty" inputmode="decimal" autocomplete="off"><span class="why" id="why-presence_penalty"></span></div>
      <div><label for="g-frequency_penalty">Frequency penalty</label><input id="g-frequency_penalty" inputmode="decimal" autocomplete="off"><span class="why" id="why-frequency_penalty"></span></div>
      <div><label for="g-seed">Seed</label><input id="g-seed" inputmode="numeric" autocomplete="off"><span class="why" id="why-seed"></span></div>
    </div>
    <label for="g-stop">Stop sequences (one per line)</label>
    <textarea id="g-stop" rows="2"></textarea><span class="why" id="why-stop"></span>
  </details>
  <div class="row"><button type="button" id="reset">Reset</button>
    <span class="note">Blank fields are not sent. Settings are sent as shown; whether the model applies them is up to the backend.</span></div>
</div>

<div class="row">
  <button id="send" class="primary">Send</button>
  <button id="stop" disabled>Stop</button>
  <span id="status"></span>
</div>

<div class="grid">
  <div><label>Reasoning stream</label><pre id="reasoning"></pre></div>
  <div><label>Output</label><pre id="output"></pre></div>
</div>
<details><summary>Result (JSON, with settings sent)</summary><pre id="result"></pre></details>

<details id="oc">
  <summary>Owner checks</summary>
  <p class="note" id="oc-guard"></p>
  <div class="row">
    <button id="oc-run" class="primary">Run owner checks</button>
    <button id="oc-stop" disabled>Stop</button>
    <button id="oc-copy" disabled>Copy record</button>
    <span id="oc-status"></span>
  </div>
  <details id="oc-other">
    <summary>Other presets</summary>
    <div class="inline">
      <select id="oc-preset">
        <option value="Full" selected>Full (default)</option><option value="Quick">Quick</option>
        <option value="Cancellation">Cancellation</option><option value="Usage">Usage</option>
      </select>
      <select id="oc-route" title="LM Studio route">
        <option value="default" selected>Responses route</option><option value="native">native route</option>
      </select>
    </div>
  </details>
  <table id="oc-table"><thead><tr><th>check</th><th>state</th><th>note</th></tr></thead><tbody></tbody></table>
  <p class="note" id="oc-summary"></p>
  <textarea id="oc-copy-fallback" class="hidden" readonly></textarea>
</details>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <label for="kind">Model source</label>
    <select id="kind">
      <option value="lmstudio">LM Studio</option>
      <option value="openrouter">OpenRouter</option>
      <option value="openai_compat">OpenAI-compatible</option>
    </select>
    <label for="base_url">Base URL (including /v1; blank = default)</label>
    <input id="base_url" placeholder="">
    <div id="key-row">
      <label for="api_key">API key (write-only; blank keeps the current key) <span id="key-state"></span></label>
      <div class="inline"><input id="api_key" type="password" autocomplete="off"><button type="button" id="clear-key">Clear</button></div>
    </div>
    <label for="model">Model ID</label>
    <div class="inline"><input id="model" list="model-list"><button type="button" id="load-models">Load models</button></div>
    <datalist id="model-list"></datalist>
    <div id="provider-row">
      <label for="provider">Provider (OpenRouter)</label>
      <div class="inline"><select id="provider"><option value="">Any (OpenRouter routing)</option></select>
        <button type="button" id="load-providers">Load providers</button></div>
    </div>
    <p id="settings-msg" class="hidden"></p>
    <div class="row" style="justify-content:flex-end">
      <button value="cancel" formnovalidate>Cancel</button>
      <button type="button" id="save" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const DEFAULT_URL = { lmstudio: "http://localhost:1234/v1", openrouter: "https://openrouter.ai/api/v1", openai_compat: "required" };
let state = {}, clearKey = false, controller = null, requestId = null;
// Generation settings (spec v6 §18.3): per tab, per request, never saved.
const NUMERIC = ["temperature", "max_tokens", "top_p", "top_k", "min_p", "repetition_penalty", "presence_penalty",
                 "frequency_penalty", "seed"];
const INTEGER = new Set(["max_tokens", "top_k", "seed"]);
const ADVANCED = ["top_p", "top_k", "min_p", "repetition_penalty", "presence_penalty", "frequency_penalty", "seed", "stop"];
const FIELDS = [...NUMERIC, "stop"];

async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? "GET" : "POST",
    headers: { "X-Session-Token": TOKEN, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function setStatus(text, error = false) { $("status").textContent = text; $("status").className = error ? "error" : ""; }

function renderState() {
  $("version").textContent = state.version ? "v" + state.version : "";
  const parts = [state.kind, state.base_url || "(default URL)", state.model || "(no model)"];
  if (state.kind === "openrouter") parts.push("provider=" + (state.provider || "any"));
  parts.push(state.key_set ? "key: set" : "key: none");
  $("summary").textContent = parts.join(" · ");
}

function syncDialogVisibility() {
  const kind = $("kind").value;
  $("base_url").placeholder = DEFAULT_URL[kind];
  $("provider-row").classList.toggle("hidden", kind !== "openrouter");
}

// --- request panel -------------------------------------------------------------------------
function level() { return state.kind === "openai_compat" ? "" : $("g-reasoning").value; }
function sentNow() { return new Set(((state.supported || {})[level()]) || []); }
function sentAtSomeLevel(name) { return Object.values(state.supported || {}).some((names) => names.includes(name)); }

function stopValue() {  // null = not sent
  const raw = $("g-stop").value;
  if (!raw.trim()) return null;
  const seqs = raw.split("\n").map((l) => l.replace(/\r$/, "")).filter((l) => l !== "");
  return seqs.length ? seqs : null;
}
function hasValue(name) { return name === "stop" ? stopValue() !== null : $("g-" + name).value.trim() !== ""; }

function refreshFields() {
  $("reasoning-field").classList.toggle("hidden", state.kind === "openai_compat");
  const sent = sentNow();
  let set = 0, notSent = 0;
  for (const name of FIELDS) {
    const ok = sent.has(name);
    $("g-" + name).disabled = !ok;  // keeps its value, so switching back restores it
    $("why-" + name).textContent = ok ? "" :
      (sentAtSomeLevel(name) ? "not sent at this reasoning level" : "not sent with this model source");
    if (ADVANCED.includes(name) && hasValue(name)) { set++; if (!ok) notSent++; }
  }
  $("adv-summary").textContent = "Advanced" + (set ? ` (${set} set${notSent ? `, ${notSent} not sent` : ""})` : "");
}

// Refuses only what JavaScript/JSON would change silently; modelSpell checks everything else.
function collectSettings() {
  const sent = sentNow(), out = {};
  if (state.kind !== "openai_compat" && $("g-reasoning").value) out.reasoning = $("g-reasoning").value;
  for (const name of NUMERIC) {
    const raw = $("g-" + name).value.trim();
    if (!sent.has(name) || !raw) continue;
    const v = Number(raw);
    if (Number.isNaN(v)) throw new Error(`${name}: "${raw}" is not a number; nothing sent`);
    if (!Number.isFinite(v)) throw new Error(`${name}: ${raw} is not a finite number; nothing sent`);
    if (INTEGER.has(name) && !Number.isSafeInteger(v)) throw new Error(`${name}: ${raw} is not a safe integer; nothing sent`);
    out[name] = v;
  }
  if (sent.has("stop")) { const seqs = stopValue(); if (seqs) out.stop = seqs; }
  return out;
}

$("g-reasoning").onchange = refreshFields;
for (const name of FIELDS) $("g-" + name).addEventListener("input", refreshFields);
$("reset").onclick = () => {
  $("g-reasoning").value = "";
  for (const name of FIELDS) $("g-" + name).value = "";
  refreshFields();
};

function dialogConfig() {
  const kind = $("kind").value;
  const cfg = { kind, base_url: $("base_url").value.trim(), model: $("model").value.trim(),
    provider: kind === "openrouter" ? $("provider").value : "" };
  if ($("api_key").value) cfg.api_key = $("api_key").value; else if (clearKey) cfg.api_key = "";
  return cfg;
}

function settingsMsg(text) { $("settings-msg").textContent = text; $("settings-msg").classList.toggle("hidden", !text); }

$("open-settings").onclick = () => {
  $("kind").value = state.kind; $("base_url").value = state.base_url || ""; $("model").value = state.model || "";
  $("api_key").value = ""; clearKey = false; $("key-state").textContent = state.key_set ? "(set)" : "(not set)";
  const p = $("provider"); p.length = 1;
  if (state.provider) p.add(new Option(state.provider, state.provider, true, true));
  settingsMsg(""); syncDialogVisibility(); $("settings").showModal();
};
$("kind").onchange = syncDialogVisibility;
$("clear-key").onclick = () => { clearKey = true; $("api_key").value = ""; $("key-state").textContent = "(will be cleared)"; };

$("load-models").onclick = async () => {
  const cfg = dialogConfig(); settingsMsg("Loading models…");
  try {
    const { models } = await api("/api/models", { kind: cfg.kind, base_url: cfg.base_url, api_key: cfg.api_key || null });
    const list = $("model-list"); list.innerHTML = "";
    for (const m of models) {
      const tags = [m.loaded ? "loaded" : null, m.reasoning_options ? "reasoning: " + m.reasoning_options.join("/") : null,
                    m.context_length ? m.context_length + " ctx" : null].filter(Boolean).join(", ");
      list.append(new Option(tags ? `${m.name || m.id} (${tags})` : (m.name || m.id), m.id));
    }
    settingsMsg(`${models.length} models loaded; type to filter.`);
  } catch (e) { settingsMsg(e.message); }
};

$("load-providers").onclick = async () => {
  const cfg = dialogConfig(); settingsMsg("Loading providers…");
  try {
    const { providers } = await api("/api/providers", { kind: cfg.kind, base_url: cfg.base_url, api_key: cfg.api_key || null, model: cfg.model });
    const p = $("provider"); p.length = 1;
    for (const x of providers) {
      const label = `${x.name} — ${x.slug ?? "no tag"}${x.quantization ? " · " + x.quantization : ""}${x.context_length ? " · " + x.context_length + " ctx" : ""}`;
      const opt = new Option(label, x.slug ?? ""); opt.disabled = !x.slug; p.add(opt);
    }
    settingsMsg(`${providers.length} endpoints for ${cfg.model}.`);
  } catch (e) { settingsMsg(e.message); }
};

$("save").onclick = async () => {
  try { state = await api("/api/config", dialogConfig()); renderState(); refreshFields(); renderGuard(); $("settings").close(); }
  catch (e) { settingsMsg(e.message); }
};

async function send() {
  let settings;
  try { settings = collectSettings(); } catch (e) { setStatus(e.message, true); return; }
  $("reasoning").textContent = ""; $("output").textContent = ""; $("result").textContent = "";
  $("send").disabled = true; $("stop").disabled = false; setStatus("waiting for first token…");
  controller = new AbortController();
  const started = performance.now();
  try {
    const r = await fetch("/api/complete", { method: "POST", signal: controller.signal,
      headers: { "X-Session-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: $("prompt").value, system: $("system").value, settings }) });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    const reader = r.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const ev = JSON.parse(buffer.slice(0, nl)); buffer = buffer.slice(nl + 1);
        if (ev.type === "started") { requestId = ev.id; }
        else if (ev.type === "cancelled") {
          setStatus(ev.sent ? "stopped — the request may have been sent; the backend may keep generating"
                            : "stopped — request not sent");
        }
        else if (ev.type === "reasoning") { $("reasoning").textContent += ev.text; setStatus("streaming…"); }
        else if (ev.type === "text") { $("output").textContent += ev.text; setStatus("streaming…"); }
        else if (ev.type === "result") {
          const res = ev.result, u = res.usage || {};
          $("result").textContent = "Settings sent (not a statement of what the model applied)\n" +
            JSON.stringify(ev.settings_sent || {}, null, 2) + "\n\nResult\n" + JSON.stringify(res, null, 2);
          setStatus([`${((performance.now() - started) / 1000).toFixed(1)}s`, res.transport,
            `finish=${res.finish_reason}`, res.truncated ? "TRUNCATED" : null,
            res.usage == null ? "usage not reported" :
              `in=${u.input_tokens ?? "?"} out=${u.output_tokens ?? "?"}` + (u.reasoning_tokens != null ? ` reasoning=${u.reasoning_tokens}` : ""),
            res.cost != null ? `$${res.cost.toFixed(6)}` : null, res.provider].filter(Boolean).join(" · "), res.truncated);
        } else if (ev.type === "error") setStatus(ev.error, true);
      }
    }
  } catch (e) {
    setStatus(e.name === "AbortError" ? "stopped (the connection was closed)" : e.message, e.name !== "AbortError");
  } finally { $("send").disabled = false; $("stop").disabled = true; controller = null; requestId = null; }
}

$("send").onclick = send;
// Stop cancels through the server's CancelHandle, so it acts before the first token too; the stream
// then ends with a "cancelled" event. If the stop request itself fails, close the connection instead.
$("stop").onclick = async () => {
  if (!controller) return;
  setStatus("stopping…");
  if (requestId) {
    try { await api("/api/complete/stop", { id: requestId }); return; } catch (e) { /* fall through */ }
  }
  controller.abort();
};
$("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); });

// --- owner checks (one button, one copy) ------------------------------------------------------
let ocRecord = null, ocPlan = null, ocCost = 0, ocCostKnown = false, ocRunning = false;
function ocStatus(text) { $("oc-status").textContent = text; }
function ocPreset() { return $("oc-preset").value || "Full"; }
function ocRoute() { return state.kind === "lmstudio" ? $("oc-route").value : "default"; }

function renderGuard() {
  $("oc-route").classList.toggle("hidden", state.kind !== "lmstudio");
  const p = (state.presets || {})[ocPreset()];
  if (!p) { $("oc-guard").textContent = ""; return; }
  const native = ocRoute() === "native";
  const caps = [...new Set(Object.values(p.max_tokens))].join("/");
  const parts = [`${state.kind} · ${native ? "native route" : "default route"} · ${state.model || "(no model)"}`
    + (state.kind === "openrouter" ? ` · provider ${state.provider || "any"}` : ""),
    `${ocPreset()}: ${p.calls} checks, ${p.requests} completion requests` + (native ? " + 1 discovery request" : ""),
    `max_tokens ${caps}`];
  if (p.padded_chars) parts.push(`padded prompt ${p.padded_chars.toLocaleString()} characters (≈${p.padded_tokens_approx.toLocaleString()} tokens)`);
  parts.push("cancelled requests may have been sent and billed");
  $("oc-guard").textContent = parts.join(" · ");
}

function ocAddRow(rec) {
  const tr = document.createElement("tr");
  const d = document.createElement("details"), sm = document.createElement("summary"), pre = document.createElement("pre");
  sm.textContent = rec.check; pre.textContent = JSON.stringify(rec, null, 2); d.append(sm, pre);
  const td1 = document.createElement("td"); td1.append(d);
  const td2 = document.createElement("td"); td2.textContent = rec.state; td2.className = "st-" + rec.state;
  const td3 = document.createElement("td"); td3.textContent = rec.note || "";
  tr.append(td1, td2, td3); $("oc-table").tBodies[0].append(tr);
  if (rec.cost != null) { ocCost += rec.cost; ocCostKnown = true; }
}

function ocCostText() { return ocCostKnown ? ` · reported cost subtotal $${ocCost.toFixed(6)}` : ""; }

async function waitForSlot() {
  // The run thread exits a moment after "done"; only a worker that outlives that is worth a message.
  const before = $("oc-status").textContent;
  let waited = 0, shown = false;
  for (;;) {
    try { const s = await api("/api/state"); if (!s.checks_running) break; } catch (e) { break; }
    if (waited >= 1500 && !shown) {
      ocStatus("Checks ended; a request is still shutting down. A new run can start once it has.");
      shown = true;
    }
    await new Promise((r) => setTimeout(r, waited < 1500 ? 250 : 1000));
    waited += waited < 1500 ? 250 : 1000;
  }
  if (shown) ocStatus(before);
  $("oc-run").disabled = false;
}

async function runChecks() {
  if (ocRunning) return;
  ocRunning = true; ocRecord = null; ocPlan = null; ocCost = 0; ocCostKnown = false;
  $("oc-table").tBodies[0].innerHTML = ""; $("oc-summary").textContent = "";
  $("oc-copy-fallback").classList.add("hidden");
  $("oc-run").disabled = true; $("oc-stop").disabled = false; $("oc-copy").disabled = true;
  ocStatus("Starting…");
  let done = null;
  try {
    const r = await fetch("/api/checks", { method: "POST",
      headers: { "X-Session-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({ preset: ocPreset(), route: ocRoute() }) });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    const reader = r.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done: eof } = await reader.read();
      if (eof) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const ev = JSON.parse(buffer.slice(0, nl)); buffer = buffer.slice(nl + 1);
        if (ev.type === "plan") { ocPlan = ev; ocStatus(`Running ${ev.preset}…`); }
        else if (ev.type === "stage") ocStatus("Preparing (finding the model)…");
        else if (ev.type === "progress") {
          if (ev.check === "preparation") ocStatus(`Preparing (finding the model)… (${ev.elapsed_s.toFixed(1)} s)`);
          else {
            const i = ocPlan ? ocPlan.checks.indexOf(ev.check) + 1 : 0, n = ocPlan ? ocPlan.checks.length : 0;
            if ($("oc-status").textContent !== "Stopping…")
              ocStatus(`Running check ${i} of ${n}: ${ev.check} (${ev.elapsed_s.toFixed(1)} s)` + ocCostText());
          }
        }
        else if (ev.type === "check") ocAddRow(ev.record);
        else if (ev.type === "done") done = ev;
      }
    }
  } catch (e) { ocStatus(e.message); }
  ocRunning = false; $("oc-stop").disabled = true;
  if (done) {
    ocRecord = done.record_markdown + "\n" + done.record_jsonl;
    $("oc-copy").disabled = false;
    const s = done.summary;
    $("oc-summary").textContent = done.record_markdown.trim().split("\n").pop();
    ocStatus(done.stopped ? "Stopped" : `Done: ${s.passed} of ${s.total} passed (${done.verdict})`);
    await waitForSlot();
    return;
  }
  $("oc-run").disabled = false;
}

$("oc-run").onclick = runChecks;
$("oc-stop").onclick = async () => {
  ocStatus("Stopping…");
  try { await api("/api/checks/stop", {}); } catch (e) { ocStatus(e.message); }
};
$("oc-copy").onclick = async () => {
  if (!ocRecord) return;
  try { await navigator.clipboard.writeText(ocRecord); ocStatus($("oc-status").textContent.replace(/ · copied$/, "") + " · copied"); }
  catch (e) {
    const ta = $("oc-copy-fallback"); ta.value = ocRecord; ta.classList.remove("hidden"); ta.focus(); ta.select();
    ocStatus("Select the text below and press Ctrl+C (Cmd+C on a Mac).");
  }
};
$("oc-preset").onchange = renderGuard;
$("oc-route").onchange = renderGuard;

function afterState() {
  renderState(); refreshFields(); renderGuard();
  if (state.checks_running && !ocRunning) { $("oc-run").disabled = true; waitForSlot(); }
}

api("/api/state").then((s) => { state = s; afterState(); }).catch((e) => setStatus(e.message, true));
</script>
</body>
</html>
